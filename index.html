<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MotoFix Pro - Sistema de Gestión para Taller de Motocicletas</title>

  <!-- PWA Metadata & Config -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#090d16" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MotoFix Pro" />
  <link rel="icon" type="image/png" href="/assets/icons/icon-192x192.png" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png" />

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- FontAwesome 6.5.1 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
  <div id="root">
    <!-- Instant initial preloader while React scripts parse -->
    <div style="position:fixed;inset:0;background-color:#070b13;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Outfit',system-ui,sans-serif;color:#f3f4f6;z-index:9999;">
      <div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
        <div style="position:absolute;inset:0;border:2px dashed rgba(245,158,11,0.35);border-radius:50%;animation:spin 4s linear infinite;"></div>
        <div style="width:68px;height:68px;border-radius:50%;background:#111827;border:1px solid rgba(245,158,11,0.5);box-shadow:0 0 25px rgba(245,158,11,0.25);display:flex;align-items:center;justify-content:center;">
          <i class="fa-solid fa-motorcycle" style="font-size:28px;color:#f59e0b;"></i>
        </div>
      </div>
      <div style="font-size:11px;font-weight:900;letter-spacing:3px;color:#f59e0b;text-transform:uppercase;margin-bottom:6px;">MotoFix Pro</div>
      <div style="font-size:13px;color:#9ca3af;font-weight:500;">Cargando sistema del taller...</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
